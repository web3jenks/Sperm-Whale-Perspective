[project]
name = "swp"
version = "0.1.0"
description = "Sperm Whale Perspective: structural comparison of sperm whale codas vs Rigvedic meter"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "lxml>=5.2",
    "pyarrow>=16.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swp"]
